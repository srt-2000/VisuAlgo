[project]
name = "visualgo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pytest>=9.1.1",
    "streamlit==1.64.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git", ".mypy_cache", ".ruff_cache", ".venv", "__pycache__", ".streamlit",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]
ignore = ["E501", "W505"]

[tool.ruff.lint.isort]
known-first-party = ["my_project"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]

python_version = "3.12"
strict = true

mypy_path = "."
explicit_package_bases = true
namespace_packages = true

show_error_codes = true
show_error_context = true
show_column_numbers = true
pretty = true

warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

exclude = [
    ".venv/", "__pycache__/", ".streamlit/",
    ".git", ".mypy_cache", ".ruff_cache",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
